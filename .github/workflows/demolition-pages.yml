# 철거왕(demolition/)을 GitHub Pages에 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔 주세요.
name: Deploy demolition game to GitHub Pages

on:
  push:
    branches: [main, claude/elegant-sagan-adckqi]
    paths:
      - 'demolition/**'
      - '.github/workflows/demolition-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demolition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demolition/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demolition/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
